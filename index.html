<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AwanOS — sistem operasi desktop yang berjalan sepenuhnya di browser sebagai situs statis.">
  <meta name="theme-color" content="#0f172a">
  <title>AwanOS</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/system.css">

  <!-- Applications: one folder per app under apps/ -->
  <link rel="stylesheet" href="apps/explorer/style.css">
  <link rel="stylesheet" href="apps/notepad/style.css">
  <link rel="stylesheet" href="apps/terminal/style.css">
  <link rel="stylesheet" href="apps/browser/style.css">
  <link rel="stylesheet" href="apps/calculator/style.css">
  <link rel="stylesheet" href="apps/paint/style.css">
  <link rel="stylesheet" href="apps/imageviewer/style.css">
  <link rel="stylesheet" href="apps/minesweeper/style.css">
  <link rel="stylesheet" href="apps/taskmanager/style.css">
  <link rel="stylesheet" href="apps/settings/style.css">
  <link rel="stylesheet" href="apps/about/style.css">
</head>
<body>
  <noscript>
    <div class="noscript">AwanOS membutuhkan JavaScript. Aktifkan JavaScript lalu muat ulang halaman.</div>
  </noscript>

  <div id="os">
    <!-- Desktop: wallpaper + icons -->
    <main id="desktop" aria-label="Desktop">
      <div id="wallpaper"></div>
      <div id="desktop-icons" role="listbox" aria-label="Ikon desktop" aria-multiselectable="true"></div>
      <div id="selection-box" hidden></div>
    </main>

    <!-- Application windows -->
    <div id="windows"></div>
    <div id="snap-preview" hidden></div>

    <!-- Taskbar -->
    <footer id="taskbar" aria-label="Bilah tugas">
      <button id="start-button" class="tb-btn" title="Mulai" aria-haspopup="true" aria-expanded="false"></button>
      <div id="taskbar-apps" role="toolbar" aria-label="Aplikasi"></div>
      <div id="tray">
        <button id="tray-quick" class="tb-btn tray-btn" title="Pengaturan cepat"></button>
        <button id="tray-clock" class="tb-btn tray-btn" title="Tanggal &amp; waktu">
          <span class="clock-time"></span>
          <span class="clock-date"></span>
        </button>
        <button id="show-desktop" title="Tampilkan desktop" aria-label="Tampilkan desktop"></button>
      </div>
    </footer>
  </div>

  <!-- Floating layers -->
  <div id="popups"></div>
  <div id="dialogs"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- Session screens -->
  <section id="boot-screen" class="screen" hidden>
    <div class="boot-logo"></div>
    <div class="boot-name">AwanOS</div>
    <div class="spinner"></div>
  </section>

  <section id="lock-screen" class="screen" hidden>
    <div class="lock-bg"></div>
    <div class="lock-clock">
      <div class="lock-time"></div>
      <div class="lock-date"></div>
      <div class="lock-hint">Klik atau tekan tombol apa saja untuk membuka</div>
    </div>
    <form class="lock-login" autocomplete="off">
      <div class="avatar avatar-lg"></div>
      <div class="lock-user"></div>
      <button type="submit" class="btn btn-primary lock-submit">Masuk</button>
    </form>
  </section>

  <section id="off-screen" class="screen" hidden>
    <button class="power-on" title="Nyalakan" aria-label="Nyalakan"></button>
    <p>AwanOS telah dimatikan.</p>
  </section>

  <!-- Core -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/icons.js"></script>
  <script src="js/core/settings.js"></script>
  <script src="js/core/vfs.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/wm.js"></script>
  <script src="js/core/apps.js"></script>
  <script src="js/core/fileops.js"></script>

  <!-- Applications (apps/<id>/app.js) -->
  <script src="apps/explorer/app.js"></script>
  <script src="apps/notepad/app.js"></script>
  <script src="apps/terminal/app.js"></script>
  <script src="apps/browser/app.js"></script>
  <script src="apps/calculator/app.js"></script>
  <script src="apps/paint/app.js"></script>
  <script src="apps/imageviewer/app.js"></script>
  <script src="apps/minesweeper/app.js"></script>
  <script src="apps/taskmanager/app.js"></script>
  <script src="apps/settings/app.js"></script>
  <script src="apps/about/app.js"></script>

  <!-- Shell -->
  <script src="js/shell/desktop.js"></script>
  <script src="js/shell/taskbar.js"></script>
  <script src="js/shell/session.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
